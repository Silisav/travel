name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # No submodules here on purpose: CI builds the public-only site,
      # which proves the build fails closed without private media.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # type check, lint, format, build, unit + leak + access tests
      - run: npm run verify
      - run: npx playwright install --with-deps chromium webkit
      # browser tests against the build: pages, menu, viewer, map, accessibility, no-JS
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
