version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Held on 6.0.x until @astrojs/check and typescript-eslint support TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Types must match the Node version we run (.nvmrc / netlify.toml: 24); bump together.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
